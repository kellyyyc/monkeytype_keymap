<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Settings | Monkeytype Keymap+</title>
    <link rel="stylesheet" href="../styles/global.css" />
    <link rel="stylesheet" href="../styles/page.css" />
    <script type="module" src="../scripts/settings.js"></script>
  </head>

  <body class="page-body">
    <div id="header">
      <div id="header-title">
        <img class="logo" src="../icons/icon_bordered.png" />
        <h1>Monkeytype Keymap+</h1>
      </div>
    </div>

    <div class="page-content">
      <h2>Settings</h2>

      <section>
        <div class="settings-group">
          <h3>Keyboard Layout</h3>
          <div class="settings-row">
            <p class="content-block">
              Choose the keyboard layout used in the popup preview.
            </p>
            <button id="dedede" class="toggle-btn settings-btn">colemak</button>
          </div>
        </div>

        <div class="settings-group">
          <h3>Angle Mod Layout</h3>
          <div class="settings-row">
            <p class="content-block">
              Adjust the rainbow preset to use an alternative layout with more
              natural finger placements.
            </p>
            <div class="settings-btn-container">
              <button
                id="disable-angle-mod-btn"
                class="toggle-btn settings-btn"
              >
                Default
              </button>
              <button id="enable-angle-mod-btn" class="toggle-btn settings-btn">
                Angle Mod
              </button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
