<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="popup.js"></script>
  </head>

  <body>
    <div id="title-container">
      <h1>Monkeytype Keymap+</h1>
      <div id="toggle-container">
        <button class="buttons">Off</button>
        <button class="buttons active">On</button>
      </div>
    </div>
    <div id="keyboard-container"></div>
    <div id="options-container">
      <button id="select-button">select all</button>
      <button id="deselect-button">deselect all</button>
      <div>text color</div>
      <input id="text-color-picker" type="color" value="#000000" />
      <div>background color</div>
      <input id="bg-color-picker" type="color" value="#ffffff" />
      <button id="save-button">save</button>
      <button id="reset-button">reset</button>
      <button id="rainbow-button">rainbow</button>
    </div>
  </body>
</html>
