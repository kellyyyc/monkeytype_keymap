<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/popup.css" />
    <script src="utils/constants.js" defer></script>
    <script src="scripts/popup.js" defer></script>
  </head>

  <body class="popup-body">
    <div id="header">
      <div id="header-title">
        <img class="logo" src="icons/icon_bordered.png" />
        <h1>Monkeytype Keymap+</h1>
      </div>
      <div id="global-toggle">
        <div class="toggle-btn-container">
          <button id="disable-extension-btn" class="toggle-btn">Off</button>
          <button id="enable-extension-btn" class="toggle-btn">On</button>
        </div>
        <svg
          id="gear-icon"
          data-extension-page="pages/settings.html"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 640 640"
        >
          <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->

            fill="currentColor"

          />
        </svg>
      </div>
    </div>

    <main>
      <div id="keyboard"></div>
      <div id="options">
        <div class="options-row">
          <div class="color-controls">
            <div class="color-setting">
              <label for="text-color-picker">Text color</label>
              <div id="text-color-picker" class="color-picker-wrapper disabled">
                <input class="color-picker" type="color" value="#000000" />
                <svg
                  class="color-picker-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 640 640"
                >
                  <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                  <path
                    fill="currentColor"
                    d="M576 320C576 320.9 576 321.8 576 322.7C575.6 359.2 542.4 384 505.9 384L408 384C381.5 384 360 405.5 360 432C360 435.4 360.4 438.7 361 441.9C363.1 452.1 367.5 461.9 371.8 471.8C377.9 485.6 383.9 499.3 383.9 513.8C383.9 545.6 362.3 574.5 330.5 575.8C327 575.9 323.5 576 319.9 576C178.5 576 63.9 461.4 63.9 320C63.9 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320zM192 352C192 334.3 177.7 320 160 320C142.3 320 128 334.3 128 352C128 369.7 142.3 384 160 384C177.7 384 192 369.7 192 352zM192 256C209.7 256 224 241.7 224 224C224 206.3 209.7 192 192 192C174.3 192 160 206.3 160 224C160 241.7 174.3 256 192 256zM352 160C352 142.3 337.7 128 320 128C302.3 128 288 142.3 288 160C288 177.7 302.3 192 320 192C337.7 192 352 177.7 352 160zM448 256C465.7 256 480 241.7 480 224C480 206.3 465.7 192 448 192C430.3 192 416 206.3 416 224C416 241.7 430.3 256 448 256z"
                  />
                </svg>
              </div>
            </div>
            <div class="color-setting">
              <label for="bg-color-picker">Background color</label>
              <div id="bg-color-picker" class="color-picker-wrapper disabled">
                <input class="color-picker" type="color" value="#000000" />
                <svg
                  class="color-picker-icon"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 640 640"
                >
                  <!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                  <path
                    fill="currentColor"
                    d="M576 320C576 320.9 576 321.8 576 322.7C575.6 359.2 542.4 384 505.9 384L408 384C381.5 384 360 405.5 360 432C360 435.4 360.4 438.7 361 441.9C363.1 452.1 367.5 461.9 371.8 471.8C377.9 485.6 383.9 499.3 383.9 513.8C383.9 545.6 362.3 574.5 330.5 575.8C327 575.9 323.5 576 319.9 576C178.5 576 63.9 461.4 63.9 320C63.9 178.6 178.6 64 320 64C461.4 64 576 178.6 576 320zM192 352C192 334.3 177.7 320 160 320C142.3 320 128 334.3 128 352C128 369.7 142.3 384 160 384C177.7 384 192 369.7 192 352zM192 256C209.7 256 224 241.7 224 224C224 206.3 209.7 192 192 192C174.3 192 160 206.3 160 224C160 241.7 174.3 256 192 256zM352 160C352 142.3 337.7 128 320 128C302.3 128 288 142.3 288 160C288 177.7 302.3 192 320 192C337.7 192 352 177.7 352 160zM448 256C465.7 256 480 241.7 480 224C480 206.3 465.7 192 448 192C430.3 192 416 206.3 416 224C416 241.7 430.3 256 448 256z"
                  />
                </svg>
              </div>
            </div>
          </div>
          <div class="control-group">
            <button id="select-all-btn" class="btn">select all</button>
            <button id="clear-selection-btn" class="btn">deselect all</button>
          </div>
        </div>
        <div class="control-group">
          <button id="save-options-btn" class="btn">save</button>
          <button id="reset-options-btn" class="btn">reset</button>
          <button id="rainbow-mode-btn" class="btn">rainbow</button>
        </div>
      </div>
    </main>

    <div class="divider"></div>
    <footer id="footer">
      <button class="btn" data-extension-page="pages/help.html">Help</button>
      <button class="btn center" data-extension-page="pages/privacy.html">
        Privacy policy
      </button>
      <button class="btn right" data-extension-page="pages/contact.html">
        Contact
      </button>
    </footer>
  </body>
</html>
