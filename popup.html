<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <script src="popup.js"></script>
  </head>

  <body>
    <div id="title-container">
      <h1>Monkeytype Keymap+</h1>
      <div id="toggle-container">
        <button class="button" id="toggle-off">Off</button>
        <button class="button" id="toggle-on">On</button>
      </div>
    </div>
    <div id="keyboard-container"></div>
    <div id="options-container">
      <button id="select-button" class="color-option">select all</button>
      <button id="deselect-button" class="color-option">deselect all</button>
      <div>text color</div>
      <input
        id="text-color-picker"
        class="color-option"
        type="color"
        value="#000000"
      />
      <div>background color</div>
      <input
        id="bg-color-picker"
        class="color-option"
        type="color"
        value="#ffffff"
      />
      <button id="save-button" class="color-option">save</button>
      <button id="reset-button" class="color-option">reset</button>
      <button id="rainbow-button" class="color-option">rainbow</button>
    </div>
  </body>
</html>
